<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitetura 3D — Reversa Docs</title>
  <meta name="reversa-category" content="diagram">
  <meta name="reversa-producer-agent" content="reversa-docs-mapper">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="assets/js/data.js"></script>
  <script src="assets/js/nav.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --border-color: rgba(255, 255, 255, 0.1);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --color-accent: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
    }
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }
    nav.reversa-doc-nav {
      display: flex;
      gap: 1rem;
    }
    nav.reversa-doc-nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      border-radius: 0.4rem;
      transition: all 0.2s;
    }
    nav.reversa-doc-nav a:hover, nav.reversa-doc-nav a.active {
      color: #fff;
      background: var(--color-accent);
    }
    .container {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .canvas-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .canvas-icon { font-size: 4rem; margin-bottom: 1rem; }
    .canvas-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .canvas-desc { color: var(--text-secondary); max-width: 500px; font-size: 0.95rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="assets/img/seal-mini.svg" alt="Mini Seal" width="32" height="32">
      <span>ClassSync AI — Arquitetura 3D</span>
    </div>
    <nav class="reversa-doc-nav"></nav>
  </header>

  <div class="container">
    <div class="canvas-container">
      <div class="canvas-icon">🧊</div>
      <div class="canvas-title">Visualização 3D de Componentes</div>
      <p class="canvas-desc">Os módulos de software identificados pelo Reversa estão prontos para renderização tridimensional interativa. Execute a extração completa para gerar a malha de dependências.</p>
    </div>
  </div>
</body>
</html>

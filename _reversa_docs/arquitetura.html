<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitetura 3D — Reversa Docs</title>
  <meta name="reversa-category" content="diagram">
  <meta name="reversa-producer-agent" content="reversa-docs-mapper">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/vendor/OrbitControls.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/nav.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --border-color: rgba(255, 255, 255, 0.1);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --color-accent: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }
    nav.reversa-doc-nav {
      display: flex;
      gap: 0.75rem;
    }
    nav.reversa-doc-nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      border-radius: 0.375rem;
      transition: all 0.2s;
    }
    nav.reversa-doc-nav a:hover, nav.reversa-doc-nav a[aria-current="page"] {
      color: #fff;
      background: var(--color-accent);
    }
    .main-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    #canvas3d {
      width: 100%;
      height: calc(100vh - 65px);
      display: block;
    }
    .info-panel {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 1rem 1.25rem;
      max-width: 320px;
      pointer-events: none;
    }
    .info-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }
    .info-detail {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32"><circle cx="32" cy="32" r="28" fill="#1e293b" stroke="#6366f1" stroke-width="3"/><text x="32" y="37" text-anchor="middle" fill="#6366f1" font-family="sans-serif" font-size="14" font-weight="bold">CS</text></svg>
      <span>ClassSync AI — Arquitetura 3D (Code City)</span>
    </div>
    <nav class="reversa-doc-nav"><a href="index.html" data-page-id="index">Visão Geral</a><a href="manual-usuario.html" data-page-id="manual-usuario">Manual do Usuário</a><a href="arquitetura.html" data-page-id="arquitetura">Arquitetura 3D</a><a href="modulos.html" data-page-id="modulos">Módulos</a><a href="topologia.html" data-page-id="topologia">Topologia</a><a href="metricas.html" data-page-id="metricas">Métricas</a><a href="glossario.html" data-page-id="glossario">Glossário</a><a href="deck.html" data-page-id="deck">Deck</a></nav>
  </header>

  <div class="main-container">
    <div class="info-panel">
      <div class="info-title">Code City 3D</div>
      <div class="info-detail" id="infoDetail">
        Passe o mouse ou rotacione a câmera (arraste com botão esquerdo) para explorar os módulos. Altura = LOC, Cor = Tipo.
      </div>
    </div>
    <canvas id="canvas3d"></canvas>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.querySelector('.main-container');
      const canvas = document.getElementById('canvas3d');
      const width = container.clientWidth;
      const height = container.clientHeight;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);
      scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

      const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(30, 25, 35);

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.01;

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x6366f1, 1.2);
      dirLight.position.set(20, 40, 20);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Grid Floor
      const gridHelper = new THREE.GridHelper(60, 30, 0x334155, 0x1e293b);
      scene.add(gridHelper);

      // Type Color Map
      const typeColors = {
        'entrypoint': 0xef4444, // Red
        'api': 0x3b82f6,        // Blue
        'core-engine': 0x10b981, // Green
        'data': 0xf59e0b,        // Amber
        'module': 0x8b5cf6       // Purple
      };

      const modulesData = (window.RV_DATA && window.RV_DATA.modules && window.RV_DATA.modules.modules) 
        ? window.RV_DATA.modules.modules 
        : [];

      const buildings = [];
      const cols = Math.ceil(Math.sqrt(modulesData.length || 1));
      const spacing = 3.5;

      modulesData.forEach((mod, idx) => {
        const row = Math.floor(idx / cols);
        const col = idx % cols;
        const x = (col - cols / 2) * spacing;
        const z = (row - cols / 2) * spacing;

        const h = Math.max(1, (mod.loc || 20) / 10);
        const color = typeColors[mod.type] || 0x6366f1;

        const geometry = new THREE.BoxGeometry(2, h, 2);
        const material = new THREE.MeshStandardMaterial({
          color: color,
          roughness: 0.3,
          metalness: 0.2
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, h / 2, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData = mod;
        scene.add(mesh);
        buildings.push(mesh);
      });

      // Raycaster for hover
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const infoDetail = document.getElementById('infoDetail');

      window.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / canvas.clientHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(buildings);

        if (intersects.length > 0) {
          const mod = intersects[0].object.userData;
          infoDetail.innerHTML = `<strong>${mod.name}</strong><br>` +
            `Caminho: <code>${mod.path}</code><br>` +
            `Tipo: ${mod.type} | LOC: ${mod.loc} | Complexidade: ${mod.complexity}`;
        }
      });

      window.addEventListener('resize', () => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    });
  </script>
</body>
</html>

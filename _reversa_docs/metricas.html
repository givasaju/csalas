<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Métricas — Reversa Docs</title>
  <meta name="reversa-category" content="diagram">
  <meta name="reversa-producer-agent" content="reversa-docs-analyst">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="assets/vendor/highcharts.js"></script>
  <script src="assets/vendor/highcharts-treemap.js"></script>
  <script src="assets/vendor/highcharts-accessibility.js"></script>
  <script src="assets/vendor/highcharts-exporting.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/nav.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --border-color: rgba(255, 255, 255, 0.1);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --color-accent: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }
    nav.reversa-doc-nav {
      display: flex;
      gap: 0.75rem;
    }
    nav.reversa-doc-nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      border-radius: 0.375rem;
      transition: all 0.2s;
    }
    nav.reversa-doc-nav a:hover, nav.reversa-doc-nav a[aria-current="page"] {
      color: #fff;
      background: var(--color-accent);
    }
    .container {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .page-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 1.5rem;
    }
    .chart-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 1.5rem;
      height: 400px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32"><circle cx="32" cy="32" r="28" fill="#1e293b" stroke="#6366f1" stroke-width="3"/><text x="32" y="37" text-anchor="middle" fill="#6366f1" font-family="sans-serif" font-size="14" font-weight="bold">CS</text></svg>
      <span>ClassSync AI — Métricas do Sistema</span>
    </div>
    <nav class="reversa-doc-nav"><a href="index.html" data-page-id="index">Visão Geral</a><a href="manual-usuario.html" data-page-id="manual-usuario">Manual do Usuário</a><a href="arquitetura.html" data-page-id="arquitetura">Arquitetura 3D</a><a href="modulos.html" data-page-id="modulos">Módulos</a><a href="topologia.html" data-page-id="topologia">Topologia</a><a href="metricas.html" data-page-id="metricas">Métricas</a><a href="glossario.html" data-page-id="glossario">Glossário</a><a href="deck.html" data-page-id="deck">Deck</a></nav>
  </header>

  <div class="container">
    <h1 class="page-title">Dashboard de Análise Quantitativa</h1>

    <div class="grid">
      <div class="chart-card" id="chart-treemap"></div>
      <div class="chart-card" id="chart-complexity"></div>
      <div class="chart-card" id="chart-histogram"></div>
      <div class="chart-card" id="chart-lang"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const metrics = (window.RV_DATA && window.RV_DATA.metrics) || {};

      Highcharts.theme = {
        colors: ['#6366f1', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
        chart: {
          backgroundColor: '#1e293b',
          style: { fontFamily: 'Inter, sans-serif' }
        },
        title: { style: { color: '#f8fafc', fontWeight: 'bold' } },
        xAxis: {
          gridLineColor: '#334155',
          labels: { style: { color: '#94a3b8' } },
          lineColor: '#334155',
          tickColor: '#334155'
        },
        yAxis: {
          gridLineColor: '#334155',
          labels: { style: { color: '#94a3b8' } },
          lineColor: '#334155',
          tickColor: '#334155'
        },
        legend: { itemStyle: { color: '#f8fafc' } }
      };
      Highcharts.setOptions(Highcharts.theme);

      // Treemap LOC by folder
      const treemapData = (metrics.treemap_loc_by_folder || []).map(item => ({
        name: item.folder,
        value: item.loc
      }));

      Highcharts.chart('chart-treemap', {
        series: [{
          type: 'treemap',
          layoutAlgorithm: 'squarified',
          data: treemapData
        }],
        title: { text: 'Distribuição de Linhas de Código (LOC) por Pasta' }
      });

      // Top Complexity
      const topComp = metrics.top_complexity || [];
      Highcharts.chart('chart-complexity', {
        chart: { type: 'column' },
        title: { text: 'Top Módulos por Complexidade Ciclomática' },
        xAxis: { categories: topComp.map(c => c.name) },
        yAxis: { title: { text: 'Complexidade Estimada' } },
        series: [{
          name: 'Complexidade',
          data: topComp.map(c => c.complexity)
        }]
      });

      // LOC Histogram
      const hist = metrics.loc_histogram || { bins: [], counts: [] };
      Highcharts.chart('chart-histogram', {
        chart: { type: 'column' },
        title: { text: 'Distribuição de Tamanho de Arquivos (LOC)' },
        xAxis: { categories: hist.bins },
        yAxis: { title: { text: 'Quantidade de Arquivos' } },
        series: [{
          name: 'Arquivos',
          data: hist.counts,
          color: '#10b981'
        }]
      });

      // Language distribution
      Highcharts.chart('chart-lang', {
        chart: { type: 'pie' },
        title: { text: 'Linguagens do Projeto' },
        series: [{
          name: 'Linhas de Código',
          data: (metrics.language_distribution || []).map(l => ({ name: l.language, y: l.loc }))
        }]
      });
    });
  </script>
</body>
</html>

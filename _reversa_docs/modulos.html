<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Módulos 2D — Reversa Docs</title>
  <meta name="reversa-category" content="diagram">
  <meta name="reversa-producer-agent" content="reversa-docs-mapper">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="assets/vendor/d3.v7.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/nav.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --border-color: rgba(255, 255, 255, 0.1);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --color-accent: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }
    nav.reversa-doc-nav {
      display: flex;
      gap: 0.75rem;
    }
    nav.reversa-doc-nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      border-radius: 0.375rem;
      transition: all 0.2s;
    }
    nav.reversa-doc-nav a:hover, nav.reversa-doc-nav a[aria-current="page"] {
      color: #fff;
      background: var(--color-accent);
    }
    .main-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #d3-svg {
      width: 100%;
      height: calc(100vh - 65px);
      display: block;
    }
    .info-panel {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 1rem 1.25rem;
      max-width: 320px;
      pointer-events: none;
    }
    .info-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }
    .info-detail {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32"><circle cx="32" cy="32" r="28" fill="#1e293b" stroke="#6366f1" stroke-width="3"/><text x="32" y="37" text-anchor="middle" fill="#6366f1" font-family="sans-serif" font-size="14" font-weight="bold">CS</text></svg>
      <span>ClassSync AI — Mapa de Módulos (D3 Force-Directed)</span>
    </div>
    <nav class="reversa-doc-nav"><a href="index.html" data-page-id="index">Visão Geral</a><a href="manual-usuario.html" data-page-id="manual-usuario">Manual do Usuário</a><a href="arquitetura.html" data-page-id="arquitetura">Arquitetura 3D</a><a href="modulos.html" data-page-id="modulos">Módulos</a><a href="topologia.html" data-page-id="topologia">Topologia</a><a href="metricas.html" data-page-id="metricas">Métricas</a><a href="glossario.html" data-page-id="glossario">Glossário</a><a href="deck.html" data-page-id="deck">Deck</a></nav>
  </header>

  <div class="main-container">
    <div class="info-panel">
      <div class="info-title">Grafo de Dependências D3</div>
      <div class="info-detail" id="infoDetail">
        Passe o mouse ou arraste os nós para explorar o acoplamento entre os módulos do sistema.
      </div>
    </div>
    <svg id="d3-svg"></svg>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const svg = d3.select('#d3-svg');
      const container = document.querySelector('.main-container');
      const width = container.clientWidth;
      const height = container.clientHeight;

      svg.attr('width', width).attr('height', height);

      const rawModules = (window.RV_DATA && window.RV_DATA.modules && window.RV_DATA.modules.modules) || [];
      const rawDeps = (window.RV_DATA && window.RV_DATA.deps && window.RV_DATA.deps.edges) || [];

      const nodes = rawModules.map(m => ({ ...m }));
      const nodeMap = new Map(nodes.map(n => [n.id, n]));

      const links = rawDeps
        .filter(d => nodeMap.has(d.source) && nodeMap.has(d.target))
        .map(d => ({ source: d.source, target: d.target, type: d.type }));

      const simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(links).id(d => d.id).distance(100))
        .force('charge', d3.forceManyBody().strength(-250))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(30));

      const g = svg.append('g');

      // Zoom & Pan
      svg.call(d3.zoom().extent([[0, 0], [width, height]]).scaleExtent([0.2, 4]).on('zoom', (event) => {
        g.attr('transform', event.transform);
      }));

      // Edges
      const link = g.append('g')
        .attr('stroke', 'rgba(148, 163, 184, 0.3)')
        .attr('stroke-width', 1.5)
        .selectAll('line')
        .data(links)
        .join('line');

      // Colors
      const typeColors = {
        'entrypoint': '#ef4444',
        'api': '#3b82f6',
        'core-engine': '#10b981',
        'data': '#f59e0b',
        'module': '#8b5cf6'
      };

      // Nodes
      const node = g.append('g')
        .selectAll('g')
        .data(nodes)
        .join('g')
        .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended));

      node.append('circle')
        .attr('r', d => Math.max(8, Math.min(24, (d.loc || 10) / 3)))
        .attr('fill', d => typeColors[d.type] || '#6366f1')
        .attr('stroke', '#fff')
        .attr('stroke-width', 1.5);

      node.append('text')
        .text(d => d.name)
        .attr('x', 12)
        .attr('y', 4)
        .attr('fill', '#f8fafc')
        .attr('font-size', '12px')
        .attr('font-weight', '600');

      const infoDetail = document.getElementById('infoDetail');

      node.on('mouseover', (event, d) => {
        infoDetail.innerHTML = `<strong>${d.name}</strong><br>` +
          `Caminho: <code>${d.path}</code><br>` +
          `Tipo: ${d.type} | LOC: ${d.loc} | Complexidade: ${d.complexity}`;
      });

      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);

        node.attr('transform', d => `translate(${d.x},${d.y})`);
      });

      function dragstarted(event) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
      }

      function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
      }

      function dragended(event) {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
      }
    });
  </script>
</body>
</html>

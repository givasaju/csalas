# ==============================================================================
# Nginx Reverse Proxy Configuration - ClassSync AI Multi-Tenant
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    sendfile        on;
    keepalive_timeout  65;

    # Upstreams para os containers dedicados de cada instituição cliente
    upstream upstream_alpha {
        server classsync-faculdade_alpha:8000;
    }

    upstream upstream_beta {
        server classsync-faculdade_beta:8000;
    }

    # --------------------------------------------------------------------------
    # Subdomínio da Faculdade Alpha: alpha.classsync.ai
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name alpha.classsync.ai alpha.localhost;

        location / {
            proxy_pass http://upstream_alpha;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        location /api/v1/health {
            proxy_pass http://upstream_alpha/api/v1/health;
            proxy_set_header Host $host;
        }
    }

    # --------------------------------------------------------------------------
    # Subdomínio da Faculdade Beta: beta.classsync.ai
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name beta.classsync.ai beta.localhost;

        location / {
            proxy_pass http://upstream_beta;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        location /api/v1/health {
            proxy_pass http://upstream_beta/api/v1/health;
            proxy_set_header Host $host;
        }
    }
}

version: '3.8'

services:
  classsync-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classsync_ai_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistência do banco de dados SQLite local
      - ./db:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

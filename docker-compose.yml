version: '3.8'

services:
  classsync:
    build:
      context: .
      dockerfile: Dockerfile
    image: classsync-ai:latest
    container_name: classsync-${TENANT_NAME:-default}
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - TENANT_NAME=${TENANT_NAME:-default}
      - PORT=${PORT:-8000}
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/classsync.db}
      - SECRET_KEY=${SECRET_KEY}
      - APP_ENV=${APP_ENV:-production}
    volumes:
      - ${DATA_DIR:-./data/${TENANT_NAME:-default}}:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - classsync-net

networks:
  classsync-net:
    name: classsync-network
    driver: bridge
